[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakdepth"
dynamic = ["version"]
description = "Split-unit leakage audits, split-validity checks and cross-corpus lineage detection for security machine-learning datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amani K. Samha" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10"]
keywords = ["data leakage", "intrusion detection", "network security", "evaluation", "dataset audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Aksamha/leakdepth"
Repository = "https://github.com/Aksamha/leakdepth"
Documentation = "https://github.com/Aksamha/leakdepth/blob/main/README.md"
Issues = "https://github.com/Aksamha/leakdepth/issues"
Changelog = "https://github.com/Aksamha/leakdepth/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6", "ruff>=0.4", "pyarrow>=12", "pyyaml>=6"]

[project.scripts]
leakdepth = "leakdepth.cli:main"

[tool.setuptools.dynamic]
version = { attr = "leakdepth._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["leakdepth"]
branch = true

[tool.ruff]
line-length = 132
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
